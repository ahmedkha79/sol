

stages:          # List of stages for jobs, and their order of execution
  - build
  - test

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  image: openjdk:21-jdk-slim 
  script:
      - chmod +x ./gradlew
      - ./gradlew assemble 

unit-test-job:   # This job runs in the test stage.
  stage: test
  image: openjdk:21-jdk-slim     # It only starts when the job in the build stage completes successfully.
  script:
      - chmod +x ./gradlew
      - ./gradlew test
   
